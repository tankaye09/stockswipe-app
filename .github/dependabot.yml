# Opens pull requests when dependencies or GitHub Actions have updates.
# Security fixes come through as soon as an advisory is published; routine
# updates are grouped weekly so they don't flood the PR list.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Expo pins matching versions of these, so bump them together with `npx expo install --fix`.
      expo-sdk:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'jest-expo'
          - 'eslint-config-expo'
          - 'react'
          - 'react-dom'
          - 'react-native'
          - 'react-native-*'
          - '@react-native-*/*'
          - '@types/react'
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major Expo SDK upgrades are done by hand, following Expo's upgrade guide.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      # React Native and React move with the Expo SDK, not on their own.
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
