# Opens pull requests when dependencies or GitHub Actions have updates.
# Security fixes come through as soon as an advisory is published; routine
# updates are grouped weekly so they don't flood the PR list.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Expo packages that move together within an SDK release.
      expo-sdk:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'jest-expo'
          - 'eslint-config-expo'
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major Expo SDK upgrades are done by hand, following Expo's upgrade guide.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      # Expo pins exact versions of these native libraries for each SDK
      # (see expo/bundledNativeModules.json). Any other version can break the
      # build, so they only change with `npx expo install --fix` after an Expo upgrade.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: '@types/react'
      # Keep these on the majors the Expo SDK and CI's Node version expect.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # eslint-config-expo's plugins (import, react) don't support ESLint 10 yet.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
