name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage -- --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails on moderate or worse. Fix with `npm update`, `npx expo install --fix`,
      # or an `overrides` entry in package.json when the parent package hasn't caught up.
      - run: npm audit --audit-level=moderate
      # Checks that every installed package matches the signature npm published.
      # Node 22's bundled npm 10 doesn't know npm's newer attestation keys, so use npm 11.
      - run: npm ci --ignore-scripts && npx --yes npm@11.21.2 audit signatures
