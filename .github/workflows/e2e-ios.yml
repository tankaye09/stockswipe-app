name: E2E (iOS)

# iOS e2e takes about 50 minutes, so it never blocks a pull request. It runs:
# - after every merge to main that touches the app, while the repo is public (macOS runners are free);
# - once a night instead (2am Singapore, only if main changed) while the repo is private, because
#   macOS minutes then cost about 10 times Linux minutes;
# - on a pull request labelled `run-ios-e2e`, for changes that could break iOS (native deps, app.json);
# - on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'e2e/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/e2e-ios.yml'
  pull_request:
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: '0 18 * * *' # 2am Singapore time
  workflow_dispatch:

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the undo toast up long enough for a slow emulator to tap it.
  EXPO_PUBLIC_UNDO_MS: '20000'
  # Turn on the admin page so flows can set tiny swipe limits on their own device.
  EXPO_PUBLIC_ADMIN_TOOLS: '1'
  # Maestro's iOS driver can take minutes to start on a cold CI simulator (ms).
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'

jobs:
  changed:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          PRIVATE: ${{ github.event.repository.private }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'run-ios-e2e') }}
          NEW_LABEL: ${{ github.event.label.name }}
          ACTION: ${{ github.event.action }}
        run: |
          run=false
          case "$EVENT" in
            workflow_dispatch) run=true ;;
            push) [ "$PRIVATE" != true ] && run=true ;;
            schedule) [ "$PRIVATE" = true ] && [ -n "$(git log --since='25 hours ago' --format=%H -1)" ] && run=true ;;
            pull_request)
              # Adding some other label shouldn't start a run.
              if [ "$LABELLED" = true ] && { [ "$ACTION" != labeled ] || [ "$NEW_LABEL" = run-ios-e2e ]; }; then run=true; fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "Not running iOS e2e for this $EVENT event."

  maestro:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: Maestro flows on an iOS simulator
    # Expo SDK 58 needs Xcode 26 or newer (Swift 6.2). macos-15 defaults to Xcode 16.4.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Keeps compiled C++ and Objective-C between nightly runs. React Native's Podfile
      # turns it on for every pod when USE_CCACHE=1 is set during pod install.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-ios
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate the native iOS project
        env:
          USE_CCACHE: '1'
        run: npx expo prebuild --platform ios

      - name: Build for the simulator (Release, JS bundled in)
        # pipefail makes a failed build fail this step, even though the output goes through tail.
        # The runner is Apple silicon, so build for arm64 only. A generic simulator build also
        # compiles everything a second time for Intel (x86_64), which doubles the build.
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -workspace ios/Swipe.xcworkspace -scheme Swipe -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 | tail -n 50

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices;for(const k in d)for(const x of d[k])if(/iPhone/.test(x.name)){console.log(x.udid);process.exit(0)}')
          xcrun simctl boot "$UDID"
          # The first boot takes about 7 minutes on CI. Wait for it, so the simulator isn't
          # still busy when Maestro starts its driver.
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Swipe.app

      # Maestro's iOS driver can take minutes to start the first time, which used
      # to fail whichever flow ran first. Start it here, retrying, so flows don't pay.
      - name: Start the Maestro iOS driver
        run: |
          for i in 1 2 3; do
            maestro hierarchy >/dev/null && exit 0
            echo "Driver not ready (try $i), retrying."
          done
          exit 1

      # One simulator, so flows run one after another, each from a fresh install
      # (onboard.yaml clears app state). They run in one Maestro call because each
      # call restarts Maestro's iOS driver, which took about 50s per flow.
      - name: Run flows
        run: |
          set -o pipefail
          maestro test e2e/flows --format junit --output e2e-ios.xml 2>&1 | tee maestro.log && exit 0
          # Run each failed flow again on its own, only so the log shows its
          # screen and app logs. The job fails whatever the second run does.
          failed=""
          for f in e2e/flows/*.yaml; do
            title=$(sed -n 's/^name: //p' "$f")
            if grep -qF "[Failed] $title (" maestro.log; then
              name=$(basename "$f" .yaml)
              failed="$failed $name"
              e2e/scripts/run-flow.sh "$name" || true
            fi
          done
          echo "::error::Failed flows:${failed:- see the log above}"
          exit 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-ios-report
          path: |
            e2e-*.xml
            ~/.maestro/tests/
