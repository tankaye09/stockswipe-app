name: E2E (iOS)

# macOS minutes cost about 10 times Linux minutes, so this runs once a night (only if main changed
# that day) and on demand from the Actions tab. Android e2e covers pull requests.
on:
  schedule:
    - cron: '0 18 * * *' # 2am Singapore time
  workflow_dispatch:

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the undo toast up long enough for a slow emulator to tap it.
  EXPO_PUBLIC_UNDO_MS: '20000'
  # Turn on the admin page so flows can set tiny swipe limits on their own device.
  EXPO_PUBLIC_ADMIN_TOOLS: '1'
  # Maestro's iOS driver can take minutes to start on a cold CI simulator (ms).
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'

jobs:
  changed:
    name: Check main changed today
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits to main since the last nightly run, so skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  maestro:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: Maestro flows on an iOS simulator
    # Expo SDK 58 needs Xcode 26 or newer (Swift 6.2). macos-15 defaults to Xcode 16.4.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios

      - name: Build for the simulator (Release, JS bundled in)
        # pipefail makes a failed build fail this step, even though the output goes through tail.
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -workspace ios/Swipe.xcworkspace -scheme Swipe -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 50

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices;for(const k in d)for(const x of d[k])if(/iPhone/.test(x.name)){console.log(x.udid);process.exit(0)}')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Swipe.app

      # Maestro's iOS driver can take minutes to start the first time, which used
      # to fail whichever flow ran first. Start it here, retrying, so flows don't pay.
      - name: Start the Maestro iOS driver
        run: |
          for i in 1 2 3; do
            maestro hierarchy >/dev/null && exit 0
            echo "Driver not ready (try $i), retrying."
          done
          exit 1

      # One simulator, so flows run one after another. Each flow starts from a
      # fresh install, and one failure doesn't stop the rest.
      - name: Run flows
        run: |
          failed=""
          for f in e2e/flows/*.yaml; do
            name=$(basename "$f" .yaml)
            e2e/scripts/run-flow.sh "$name" || failed="$failed $name"
          done
          if [ -n "$failed" ]; then echo "::error::Failed flows:$failed"; exit 1; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-ios-report
          path: |
            e2e-*.xml
            ~/.maestro/tests/
