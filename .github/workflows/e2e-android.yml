name: E2E (Android)

on:
  pull_request:
    paths-ignore: ['**.md']
  # On main only the build runs, to fill the caches every pull request starts from.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the undo toast up long enough for a slow emulator to tap it.
  EXPO_PUBLIC_UNDO_MS: '20000'
  # Bump to throw away the cached APK, e.g. after changing how it is built.
  APK_CACHE_VERSION: '2'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      flows: ${{ steps.flows.outputs.flows }}
    steps:
      - uses: actions/checkout@v4
      - name: List flows
        id: flows
        run: echo "flows=$(ls e2e/flows/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

      # Reuse the last APK when nothing that goes into it has changed, e.g. when only flows or docs changed.
      - name: Restore a matching APK
        id: apk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apk
          key: apk-${{ env.APK_CACHE_VERSION }}-${{ env.EXPO_PUBLIC_UNDO_MS }}-${{ hashFiles('package-lock.json', 'app.json', 'tsconfig.json', 'src/**', 'assets/**') }}

      - uses: actions/setup-node@v4
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle's downloads and build outputs between runs.
      # Pull requests save their own caches too, so a second push to the same pull request builds fast.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          cache-read-only: false
      - run: npm ci
        if: steps.apk.outputs.cache-hit != 'true'
      - name: Generate the native Android project
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          npx expo prebuild --platform android --no-install
          # The default 512 MB metaspace runs out near the end of the build.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
      # Most of the build is compiling the native libraries (C++ and Kotlin), which only change with
      # dependencies or app.json. Restore their build output so Gradle only redoes what changed,
      # usually just the JS bundle. Restored after prebuild, which recreates the android folder.
      - name: Restore native build output
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/build
            android/app/build
            android/app/.cxx
            node_modules/**/android/build
            node_modules/**/android/.cxx
          key: android-native-${{ env.APK_CACHE_VERSION }}-${{ hashFiles('package-lock.json', 'app.json') }}
      - name: Build a release APK (JS bundled in, no dev server needed)
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: android
        # R8 minifying and PNG crunching only shrink the APK, which tests don't need, and they take minutes.
        run: >
          ./gradlew assembleRelease --build-cache
          -PreactNativeArchitectures=x86_64
          -Pandroid.enableMinifyInReleaseBuilds=false
          -Pandroid.enablePngCrunchInReleaseBuilds=false
      - name: Move the APK where the cache expects it
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ runner.temp }}/apk/app-release.apk
          retention-days: 3

  flow:
    # Each flow gets its own runner and a fresh emulator, so flows run in
    # parallel and can't affect each other.
    name: ${{ matrix.flow }}
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(needs.build.outputs.flows) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: ${{ runner.temp }}/apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator image needs more disk than the runner has free by default.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      # A saved emulator snapshot boots in seconds instead of a minute-long cold boot.
      # aosp_atd is Google's slimmed-down image for automated tests: no Play services or
      # preinstalled apps keeping the CPU busy, so the app starts faster.
      - name: Restore the emulator snapshot
        id: avd
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-aosp_atd-x86_64-2cores-3072M-settled

      - name: Create the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          cores: 2
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          # Right after boot, Android keeps optimising system apps for a while. Let that
          # finish before saving, so every flow starts on an idle emulator.
          script: sleep 90 && echo "Saved an emulator snapshot."

      - name: Run ${{ matrix.flow }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          # Leave 2 of the runner's 4 cores to the host; giving the emulator all 4 made runs worse.
          cores: 2
          ram-size: 3072M
          force-avd-creation: false
          # Boot from the snapshot and leave it unchanged, so every flow starts from the same emulator.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install "${{ runner.temp }}/apk/app-release.apk"
            e2e/scripts/run-flow.sh "${{ matrix.flow }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android-${{ matrix.flow }}
          path: |
            e2e-${{ matrix.flow }}.xml
            ~/.maestro/tests/
