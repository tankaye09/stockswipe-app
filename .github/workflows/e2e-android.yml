name: E2E (Android)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the undo toast up long enough for a slow emulator to tap it.
  EXPO_PUBLIC_UNDO_MS: '20000'

jobs:
  maestro:
    name: Maestro flows on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The release build plus the emulator image overflow the runner's disk, so clear tools we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build a release APK (JS bundled in, no dev server needed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Keep the APK and drop build leftovers
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          rm -rf android ~/.gradle/caches
          df -h /

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install "$RUNNER_TEMP/app-release.apk"
            maestro test e2e/flows --format junit --output e2e-report.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android-report
          path: |
            e2e-report.xml
            ~/.maestro/tests/
