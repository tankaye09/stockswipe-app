name: E2E (Android)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the undo toast up long enough for a slow emulator to tap it.
  EXPO_PUBLIC_UNDO_MS: '20000'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      flows: ${{ steps.flows.outputs.flows }}
    steps:
      - uses: actions/checkout@v4
      - name: List flows
        id: flows
        run: echo "flows=$(ls e2e/flows/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build a release APK (JS bundled in, no dev server needed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  flow:
    # Each flow gets its own runner and a fresh emulator, so flows run in
    # parallel and can't affect each other.
    name: ${{ matrix.flow }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(needs.build.outputs.flows) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: ${{ runner.temp }}/apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator image needs more disk than the runner has free by default.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - name: Run ${{ matrix.flow }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Leave 2 of the runner's 4 cores to the host; giving the emulator all 4 made runs worse.
          cores: 2
          ram-size: 3072M
          script: |
            adb install "${{ runner.temp }}/apk/app-release.apk"
            e2e/scripts/run-flow.sh "${{ matrix.flow }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android-${{ matrix.flow }}
          path: |
            e2e-${{ matrix.flow }}.xml
            ~/.maestro/tests/
