name: E2E (Android)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Maestro flows on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The native build plus the emulator image can fill the runner's disk.
      # Remove preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build a release APK (JS bundled in, no dev server needed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell settings put global package_verifier_enable 0
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test e2e/flows --format junit --output e2e-report.xml

      - name: Show Maestro's log for failed flows
        if: failure()
        run: grep -hE "FAILED|Assertion|Swipe|swipe|Tap|tap" ~/.maestro/tests/*/maestro.log | tail -150 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android-report
          path: |
            e2e-report.xml
            ~/.maestro/tests/
