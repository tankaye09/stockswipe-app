appId: com.stockswipe.app
name: The tab bar icons switch between the four sections
---
- runFlow: ../subflows/onboard.yaml
- tapOn:
    id: 'tab-watchlist'
- assertVisible:
    id: 'watchlist-empty'
- tapOn:
    id: 'tab-paper'
- assertVisible:
    id: 'portfolio'
- tapOn:
    id: 'tab-settings'
- assertVisible:
    id: 'settings'
- tapOn:
    id: 'tab-discover'
- assertVisible:
    id: 'deck'
