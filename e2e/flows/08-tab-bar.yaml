appId: com.stockswipe.app
name: The tab bar switches between the four sections
---
# Tabs are matched by label: Maestro can't read native tab testIDs on Android.
- runFlow: ../subflows/onboard.yaml
- tapOn: 'Watchlist'
- assertVisible:
    id: 'watchlist-empty'
- tapOn: 'Paper'
- assertVisible:
    id: 'portfolio'
- tapOn: 'Settings'
- assertVisible:
    id: 'settings'
- tapOn: 'Discover'
- assertVisible:
    id: 'deck'
