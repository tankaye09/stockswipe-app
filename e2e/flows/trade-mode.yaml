appId: com.stockswipe.app
name: Trade mode asks for a broker first
---
- runFlow: ../subflows/onboard.yaml
# Leave Settings scrolled to the bottom. The tab keeps that position, so Trade mode
# must jump back up to the broker picker when it sends the user there.
- tapOn:
    id: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'open-admin'
    direction: DOWN
- assertNotVisible:
    id: 'broker-moomoo'
- tapOn:
    id: 'tab-discover'
- tapOn:
    id: 'mode-trade'
- tapOn:
    id: 'right-button'
- assertVisible:
    id: 'pick-broker-hint'
- tapOn:
    id: 'broker-moomoo'
- assertVisible:
    id: 'broker-moomoo'
    selected: true
