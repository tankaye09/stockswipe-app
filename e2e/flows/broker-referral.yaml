appId: com.needleinhaystack.app
name: Users without a broker see sign-up links with a referral disclosure
---
- runFlow: ../subflows/onboard.yaml
- tapOn:
    id: 'tab-settings'
- assertVisible:
    id: 'signup-moomoo'
- assertVisible:
    id: 'signup-tiger'
- assertVisible:
    id: 'signup-ibkr'
- assertVisible: '.*may earn a referral fee.*'
- tapOn:
    id: 'broker-tiger'
- assertNotVisible:
    id: 'signup-moomoo'
