appId: com.stockswipe.app
name: Paper buy shows up in the paper portfolio
---
- runFlow: ../subflows/onboard.yaml
- tapOn:
    id: 'card-symbol'
- assertVisible:
    id: 'stock-screen'
- assertVisible: 'In plain English'
- scrollUntilVisible:
    element:
      id: 'paper-buy'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'paper-buy'
- assertVisible:
    id: 'paper-message'
- assertVisible:
    id: 'paper-position'
- back
- tapOn: 'Paper'
- assertVisible: '1 share'
