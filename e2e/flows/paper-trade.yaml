appId: com.stockswipe.app
name: Paper buy shows up in the paper portfolio
---
- runFlow: ../subflows/onboard.yaml
- tapOn:
    id: 'card-symbol'
- assertVisible:
    id: 'stock-screen'
- assertVisible: 'In plain English'
- scrollUntilVisible:
    element:
      id: 'paper-buy'
    direction: DOWN
    # The panel sits near the end of the page, so it can't be scrolled to the
    # centre. Ask for the whole button to be on screen instead.
    visibilityPercentage: 100
- waitForAnimationToEnd
- tapOn:
    id: 'paper-buy'
# The message appears under the buttons, and the new position row pushes it
# down, so on the small CI screen it can land below the fold.
- scrollUntilVisible:
    element:
      id: 'paper-message'
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: 'paper-position'
# Maestro's `back` only works on Android, and the header back button has no
# label shared by both platforms. Restart the app instead: it opens on the
# tabs with the saved trade, which also checks that paper trades persist.
- launchApp
# A cold start on a CI emulator can take well over the default wait.
- extendedWaitUntil:
    visible:
      id: 'tab-paper'
    timeout: 60000
- tapOn:
    id: 'tab-paper'
# On iOS a pressable row reads as one element holding all of its text, so
# match "1 share" anywhere in it rather than as the whole text.
- assertVisible: '.*1 share.*'
