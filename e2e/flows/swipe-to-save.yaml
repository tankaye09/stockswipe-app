appId: com.stockswipe.app
name: Swiping right saves to the watchlist
---
- runFlow: ../subflows/onboard.yaml
# A long, quick drag across the card, well past the swipe threshold.
- swipe:
    start: '15%, 45%'
    end: '95%, 45%'
    duration: 300
- assertVisible: 'Saved .* to your watchlist'
- tapOn:
    id: 'tab-watchlist'
- assertVisible:
    id: 'watchlist'
- assertNotVisible:
    id: 'watchlist-empty'
