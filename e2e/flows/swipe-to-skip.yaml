appId: com.stockswipe.app
name: Swiping left skips without saving
---
- runFlow: ../subflows/onboard.yaml
- swipe:
    start: '85%, 45%'
    end: '5%, 45%'
    duration: 300
- tapOn:
    id: 'skip-button'
- assertVisible:
    id: 'card-symbol'
- tapOn: 'Watchlist'
- assertVisible:
    id: 'watchlist-empty'
