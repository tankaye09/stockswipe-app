appId: com.stockswipe.app
name: Paper buy shows up in the paper portfolio
---
- runFlow: ../subflows/onboard.yaml
- tapOn:
    id: 'card-symbol'
- assertVisible:
    id: 'stock-screen'
- assertVisible: 'In plain English'
- scrollUntilVisible:
    element:
      id: 'paper-buy'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'paper-buy'
- assertVisible:
    id: 'paper-message'
- assertVisible:
    id: 'paper-position'
# Maestro's `back` only works on Android, so tap the header's back button.
# It is labelled "Back" on iOS and "Navigate up" on Android.
- tapOn: 'Back|Navigate up'
- tapOn:
    id: 'tab-paper'
- assertVisible: '1 share'
