# Sets this device's free tier limits on the admin page, then returns to the feed.
# Pass FREE_DAYS, DAILY_SWIPES and AD_EVERY as env. The values come in through
# a link that fills in the admin fields, because typing on the iOS number pad
# drops taps on a CI simulator. The flow still presses Save itself.
appId: com.needleinhaystack.app
---
- runFlow:
    file: open-link.yaml
    env:
      LINK: 'haystack://admin?freeDays=${FREE_DAYS}&dailySwipes=${DAILY_SWIPES}&adEvery=${AD_EVERY}'
- extendedWaitUntil:
    visible:
      id: 'admin'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'admin-save'
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: 'admin-save'
# The note shows under the Save button, which can be at the bottom edge.
- scrollUntilVisible:
    element:
      id: 'admin-note'
      text: 'Saved for this device.'
    direction: DOWN
- scrollUntilVisible:
    element:
      id: 'admin-done'
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: 'admin-done'
- tapOn:
    id: 'tab-discover'
- assertVisible:
    id: 'deck'
