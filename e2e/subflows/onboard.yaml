# Every flow starts here, from a fresh install: no saved state, watchlist or
# paper trades carry over from another flow, so flows can run in any order or
# in parallel on separate devices.
appId: com.stockswipe.app
---
# A system prompt left over from an earlier flow (iOS asks 'Open in "Swipe"?'
# for deep links) would cover the app, so close it first.
- runFlow:
    when:
      visible: 'Open in .Swipe.\?'
    commands:
      - tapOn: 'Cancel'
- stopApp
- launchApp:
    clearState: true
# A cold start on a CI emulator can take well over the default wait.
- extendedWaitUntil:
    visible: 'What are you into?'
    timeout: 60000
- assertVisible:
    id: 'onboarding-continue'
    enabled: false
- tapOn:
    id: 'interest-gaming'
- tapOn:
    id: 'interest-ai'
- tapOn:
    id: 'interest-coffee-food'
- tapOn:
    id: 'onboarding-continue'
- assertVisible:
    id: 'deck'
- assertVisible:
    id: 'card-symbol'
