# Fresh install: pick interests and land on the swipe feed.
appId: com.stockswipe.app
---
- launchApp:
    clearState: true
# A cold start on a CI emulator can take well over the default wait.
- extendedWaitUntil:
    visible: 'What are you into?'
    timeout: 60000
- assertVisible:
    id: 'onboarding-continue'
    enabled: false
- tapOn:
    id: 'interest-gaming'
- tapOn:
    id: 'interest-ai'
- tapOn:
    id: 'interest-coffee-food'
- tapOn:
    id: 'onboarding-continue'
- assertVisible:
    id: 'deck'
- assertVisible:
    id: 'card-symbol'
