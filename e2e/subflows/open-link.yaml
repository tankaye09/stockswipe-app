# Opens a deep link the same way on both platforms. iOS first asks
# 'Open in "Haystack"?' for a link from outside the app, and if nobody answers, the
# dialog stays up over every later flow. On a CI simulator the prompt can take
# 20 seconds or more to show up, and iOS doesn't always ask (it may remember the
# answer), so iOS waits for it without failing and taps Open if it came.
# Android opens the link directly. Usage: runFlow with env LINK.
appId: needle.inhaystack.app
---
- openLink: ${LINK}
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Open in .Haystack.\?'
          timeout: 40000
          optional: true
      # A tap while the prompt is still animating in can miss and leave it up,
      # so wait for it to settle, and tap again if it is still there.
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: 'Open'
          optional: true
      - runFlow:
          when:
            visible: 'Open in .Haystack.\?'
          commands:
            - tapOn: 'Open'
