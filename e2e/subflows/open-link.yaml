# Opens a deep link the same way on both platforms. iOS first asks
# 'Open in "Swipe"?' for a link from outside the app, and if nobody answers, the
# dialog stays up over every later flow. On a CI simulator the prompt can show
# up later than one optional tap waits, and iOS doesn't always ask (it may
# remember the answer), so iOS tries the tap a few times and never fails on it.
# Android opens the link directly. Usage: runFlow with env LINK.
appId: com.stockswipe.app
---
- openLink: ${LINK}
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 3
          commands:
            - tapOn:
                text: 'Open'
                optional: true
